[workspace]
resolver = "3"
members = ["crates/fabr-core", "crates/fabr", "crates/fabr-agent", "app/src-tauri"]
default-members = ["crates/fabr-core", "crates/fabr"]

[workspace.package]
version = "0.2.8"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"

[workspace.dependencies]
fabr-core = { path = "crates/fabr-core" }
fabr-agent = { path = "crates/fabr-agent" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml_edit = "=0.25.17"
sha1_smol = "=1.0.1"
tempfile = "=3.27.0"
tar = "=0.4.46"
indexmap = { version = "=2.14.2", features = ["serde"] }
chrono = "=0.4.45"
rand = "=0.10.3"
directories = "=6.0.0"
log = { version = "=0.4.34", features = ["std"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive"] }
tiny_http = "=0.12.0"
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "json"] }
include_dir = "=0.7.4"
tauri = "=2.12.4"
tauri-build = "=2.7.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.0"
serde_yaml = "=0.9.33"

[workspace.lints.clippy]
result_large_err = "allow"
large_enum_variant = "allow"
